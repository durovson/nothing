services:
  - type: web
    name: gift-guarant
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: "10000"
      - key: APP_BASE_URL
        value: https://garant-i3z6.onrender.com
      - key: RENDER_KEEPALIVE_ENABLED
        value: "true"
      - key: RENDER_KEEPALIVE_INTERVAL_SECONDS
        value: "600"
      - key: RENDER_KEEPALIVE_TIMEOUT_SECONDS
        value: "10"
      - key: TELEGRAM_USE_POLLING
        value: "true"
      - key: TELEGRAM_BOT_USERNAME
        value: grntrobot
      - key: SUPPORT_USERNAME
        value: "@ton_geist"
      - key: TON_API_ENDPOINT
        value: https://tonapi.io/v2
      - key: TON_NETWORK
        value: mainnet
      - key: TON_GUARANT_ADDRESS
        sync: false
      - key: ESCROW_FEE_RATE
        value: "0.01"
      - key: AUTO_PAYOUT_AFTER_PAYMENT
        value: "false"
      - key: SERVICE_FEE_COMMENT
        value: Service fee
      - key: TON_PAYOUT_FEE_RESERVE
        value: "0.01"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: TON_API_KEY
        sync: false
      - key: TON_MNEMONIC
        sync: false
      - key: SERVICE_FEE_WALLET
        sync: false
